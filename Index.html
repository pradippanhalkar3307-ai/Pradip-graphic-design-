<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pradip Graphic Design</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 18px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }

    .box {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px #ccc;
    }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #111;
      color: white;
      border: none;
      cursor: pointer;
    }

    canvas {
      width: 100%;
      margin-top: 15px;
      border-radius: 8px;
      background: white;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row input {
      width: 50%;
    }
  </style>
</head>

<body>

<header>
  <h2>Pradip Graphic Design</h2>
  <p>Simple Poster Maker</p>
</header>

<div class="container">

  <div class="box">
    <h3>📷 Photo Upload</h3>
    <input type="file" id="photo" accept="image/*">
  </div>

  <div class="box">
    <h3>✍️ Text</h3>

    <textarea id="text" rows="3"
      placeholder="तुमचा मजकूर येथे लिहा..."></textarea>

    <div class="row">
      <input type="number" id="size" value="35" min="10" max="100">
      <input type="color" id="color" value="#ffffff">
    </div>

    <button onclick="addText()">Text Add करा</button>
  </div>

  <div class="box">
    <h3>🎨 Poster</h3>

    <canvas id="canvas" width="1080" height="1080"></canvas>

    <button onclick="downloadImage()">
      💾 PNG Download
    </button>
  </div>

</div>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  let image = null;
  let posterText = "";

  function drawPoster() {

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (image) {
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
    }

    if (posterText) {
      const size = Number(document.getElementById("size").value);
      const color = document.getElementById("color").value;

      ctx.font = "bold " + size + "px Arial";
      ctx.fillStyle = color;
      ctx.textAlign = "center";

      ctx.fillText(
        posterText,
        canvas.width / 2,
        canvas.height - 120
      );
    }
  }

  document.getElementById("photo").addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(event) {

      image = new Image();

      image.onload = function() {
        drawPoster();
      };

      image.src = event.target.result;
    };

    reader.readAsDataURL(file);
  });

  function addText() {

    posterText = document.getElementById("text").value;

    drawPoster();
  }

  function downloadImage() {

    drawPoster();

    const link = document.createElement("a");

    link.download = "pradip-graphic-design.png";

    link.href = canvas.toDataURL("image/png");

    link.click();
  }

  drawPoster();
</script>

</body>
</html>
